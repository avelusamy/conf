# BACKGROUND
background {
    monitor =
    path = /home/juniper/.config/hypr/images/correctedwallpaper.png
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
auth {
    fingerprint:enabled = true
    pam:module = hyprlock
}
# GENERAL
general {
#    no_fade_in = false
#    grace = 0
#    disable_loading_bar = false
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(0,0,0, 1.0)
    font_size = 100
    font_family = Nanum Pen
    position = 0, 640
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 55
    font_family = Nanum Pen
    color = rgba(0,0,0, 1.0)
    position = 0, 885
    halign = center
    valign = center
}

# Foreground
image {
    monitor =
    path = ~/.config/hypr/foreground.png
    size = 700
    border_size = 0
    rounding = 0
    rotate = 0
    reload_time = 0
    reload_cmd =
    position = 0, -66
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(0, 0, 0, 0.80)
#    outline_thickness = 2
#   dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
#   dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
#   dots_center = true
    font_size = 18
    font_family = Jetbrains Mono NL
    position = 0, -680
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.1)
    font_color = rgb(25, 25, 25)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = Enter Password
    hide_input = false
    position = 0, -750
    halign = center
    valign = center
}
